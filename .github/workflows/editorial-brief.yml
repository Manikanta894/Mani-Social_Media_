# ============================================================================
# SocialForge Editorial Briefs — morning + evening Telegram summaries
# 02:30 UTC = 08:00 IST (morning) · 14:30 UTC = 20:00 IST (evening)
# ============================================================================
name: SocialForge Editorial Briefs

on:
  schedule:
    - cron: '30 2 * * *'    # 08:00 IST morning brief
    - cron: '30 14 * * *'   # 20:00 IST evening brief
  workflow_dispatch: {}

jobs:
  send-brief:
    name: Send editorial brief
    runs-on: ubuntu-latest
    env:
      AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
    steps:
      - name: Morning brief (or current time of run)
        run: |
          SECRET="${AUTOMATION_SECRET:-b6b8baeca0444dc5c23068254b9239c80b2d1f83fbf576e7276aaa50d281371a}"
          HOUR=$(TZ='Asia/Kolkata' date +%H)
          TYPE=$([ "$HOUR" -lt 12 ] && echo "morning" || echo "evening")
          curl -sS -o /tmp/brief.json -w "brief: %{http_code}\n" \
            -X POST "https://social.manikantar.in/api/news/brief" \
            -H "Content-Type: application/json" \
            -H "x-automation-secret: ${SECRET}" \
            -d "{\"type\":\"${TYPE}\"}" || true
          cat /tmp/brief.json || true
