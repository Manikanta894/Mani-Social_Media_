# ============================================================================
# SocialForge Automation Scheduler — fallback to Vercel Cron.
# Vercel Cron is the primary scheduler (/api/cron, every 5 min, one job per
# invocation to stay under the Google Sheets 60-reads/min quota).
# This workflow is a redundant fallback when GitHub's free-plan cron fires.
# ============================================================================
name: SocialForge Automation

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub delays on free plan)
  workflow_dispatch: {}     # manual "Run workflow" button

jobs:
  run-tick:
    name: Run one automation job
    runs-on: ubuntu-latest
    steps:
      - name: Automation cron tick
        run: |
          curl -sS -o /tmp/cron.json -w "cron: %{http_code}\n" \
            -X POST "https://social.manikantar.in/api/cron" || true
          cat /tmp/cron.json || true
